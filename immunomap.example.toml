# Uso: immunomap run --dataset kang2018 --config immunomap.example.toml
[immunomap]
integration = "harmony"      # none | harmony | scvi
resolution = 0.6             # grupos do mapa
annotation_resolution = 1.5  # grupos finos usados só para nomear os tipos
n_pcs = 30
min_genes_per_cell = 200
max_genes_per_cell = 6000
max_mito_percent = 15.0
min_cells_pseudobulk = 10
reference_condition = ""     # vazio = primeira condição em ordem alfabética (ex.: ctrl)
random_state = 0
n_jobs = 0                   # DESeq2: tipos celulares em paralelo (0 = todos os núcleos, 1 = um de cada vez)
