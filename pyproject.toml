[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "immunomap"
version = "0.3.0"
description = "Análise reprodutível de scRNA-seq com várias amostras: integração, anotação e expressão diferencial por pseudobulk"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rubens Lyra"}]
keywords = ["scRNA-seq", "single-cell", "batch-correction", "harmony", "pseudobulk", "scanpy"]
dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "leidenalg>=0.10",
    "igraph>=0.10",
    "harmonypy>=0.1,<0.2",   # 0.1.x: NumPy puro (2.x não tem wheel para Windows)
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pydeseq2>=0.4",
    "streamlit>=1.30",
]

[project.optional-dependencies]
scvi = ["scvi-tools>=1.0"]
bench = ["celltypist>=1.6"]
dev = ["pytest>=7.0"]

[project.scripts]
immunomap = "immunomap.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immunomap = ["app/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
